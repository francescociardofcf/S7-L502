<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Backoffice - Crea Prodotto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container mt-5">
      <h1>Aggiungi un prodotto</h1>
      <form id="product-form">
        <input class="form-control my-2" placeholder="Nome" id="name" required />
        <input class="form-control my-2" placeholder="Descrizione" id="description" required />
        <input class="form-control my-2" placeholder="Prezzo" type="number" id="price" required />
        <input class="form-control my-2" placeholder="Brand" id="brand" required />
        <input class="form-control my-2" placeholder="URL Immagine" id="imageUrl" required />
        <button type="submit" class="btn btn-success mt-2">Salva</button>
        <button type="details" class="btn btn-tertiary mt-2">Details</button>
        <button type="delete" class="btn btn-secondary mt-2">Delete</button>
      </form>
      <div id="message" class="mt-3"></div>
    </div>

    <script>
      const endpoint = "https://striveschool-api.herokuapp.com/api/product/";
      const token =
        "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI2ODE0OTRlOTFjMjUwNDAwMTUxYWI2YzMiLCJpYXQiOjE3NDYxODUyMDQsImV4cCI6MTc0NzM5NDgwNH0.utRz95zd4G9Qaeb0vD9EIULgZVHQYhZtmp4OY1gHvWg";

      const form = document.getElementById("product-form");
      const message = document.getElementById("message");

      form.addEventListener("submit", async e => {
        e.preventDefault();

        form.addEventListener("delete", async e => {
            e.preventDefault();

        const product = {
          name: document.getElementById("name").value,
          description: document.getElementById("description").value,
          price: parseFloat(document.getElementById("price").value),
          brand: document.getElementById("brand").value,
          imageUrl: document.getElementById("imageUrl").value,
        };

        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: token,
            },
            body: JSON.stringify(product),
          });

          if (!res.ok) throw new Error("Errore nella creazione");

          const data = await res.json();
          message.innerHTML = `<div class="alert alert-success">Prodotto creato con ID: ${data._id}</div>`;
          form.reset();
        } catch (err) {
          message.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
        }
      });
    </script>
  </body>
</html>
