<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Catalogo Prodotti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container mt-5">
      <h1>Prodotti disponibili</h1>
      <div id="products-container" class="row"></div>
    </div>

    <script>
      const endpoint = "https://striveschool-api.herokuapp.com/api/product/";
      const token =
        "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI2ODE0OTRlOTFjMjUwNDAwMTUxYWI2YzMiLCJpYXQiOjE3NDYxODUyMDQsImV4cCI6MTc0NzM5NDgwNH0.utRz95zd4G9Qaeb0vD9EIULgZVHQYhZtmp4OY1gHvWg";

      const getProducts = async () => {
        try {
          const response = await fetch(endpoint, {
            headers: {
              Authorization: token,
            },
          });

          if (!response.ok) throw new Error("Errore HTTP: " + response.status);

          const products = await response.json();
          const container = document.getElementById("products-container");
          container.innerHTML = "";

          products.forEach(p => {
            const div = document.createElement("div");
            div.className = "col-md-4 mb-3";
            div.innerHTML = `
            <div class="card h-100">
              <img src="${p.imageUrl}" class="card-img-top" alt="${p.name}">
              <div class="card-body">
                <h5 class="card-title">${p.name}</h5>
                <p class="card-text">${p.description}</p>
                <button class="btn btn-primary">Dettagli</button>
                <button class="btn btn-secondary" onclick="BuyProduct('${p._id}')">BUY NOW!</button> 
              </div>
            </div>
          `;
            container.appendChild(div);
          });
        } catch (err) {
          console.error("Errore:", err);
        }
      };

      window.addEventListener("DOMContentLoaded", getProducts);
    </script>
  </body>
</html>
